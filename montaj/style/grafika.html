<!doctype html><meta charset="utf-8">
<!--
  Grafika qatlami — har kadr uchun ?t=<sekund> bo'yicha hisoblanadi.
  Bu yerda CSS animatsiya ishlatilmaydi: hamma narsa JS da aniq vaqtdan
  hisoblanadi, shunda render takrorlanuvchi (deterministik) bo'ladi va
  easing egri chiziqlarini to'liq boshqarish mumkin.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;
    font-family:'Inter',sans-serif;color:#fff}
  .qatlam{position:absolute;inset:0}

  /* ---- to'liq ekran karta ---- */
  .karta{position:absolute;inset:0;transform-origin:50% 42%}
  .karta .fon{position:absolute;inset:0;
    background:radial-gradient(ellipse 72% 46% at 50% 32%,
      var(--brend-yorqin) 0%, var(--brend) 46%, var(--brend-toq) 100%)}
  .karta .setka{position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 135px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 135px)}
  .tog{position:absolute;left:0;right:0;bottom:0}
  .tog svg{display:block;width:100%}
  .k-ust{position:absolute;left:0;right:0;top:500px;text-align:center;
    font-size:51px;font-weight:500;font-style:italic;
    text-shadow:0 3px 14px rgba(0,0,0,.45)}
  .k-band{position:absolute;left:0;top:1110px;width:100%;height:138px;
    background:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 44px rgba(0,0,0,.42)}
  .k-band span{color:var(--brend);font-size:78px;font-weight:900;font-style:italic;
    text-transform:uppercase;white-space:nowrap;padding:0 46px}
  .k-chiplar{position:absolute;left:0;right:0;top:1290px;display:flex;
    flex-direction:column;align-items:center;gap:18px}
  .k-chip{background:rgba(0,0,0,.26);border:2px solid rgba(255,255,255,.3);
    border-radius:999px;padding:12px 30px;font-size:34px;font-weight:500;font-style:italic}
  .k-quote{position:absolute;left:60px;right:60px;top:1530px;text-align:center;
    font-size:84px;font-weight:900;font-style:italic;line-height:1.08;
    text-shadow:0 5px 20px rgba(0,0,0,.5)}

  /* ---- video ustidagi chip ---- */
  .chip{position:absolute;left:72px;right:72px;top:1230px;min-height:210px;
    border-radius:36px;display:flex;align-items:center;gap:34px;padding:26px 38px;
    background:linear-gradient(152deg,var(--brend-yorqin),var(--brend) 72%);
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 20px 56px rgba(0,0,0,.55);transform-origin:50% 50%}
  .ikon{flex:0 0 120px;height:120px;border-radius:999px;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center}
  .ikon svg{width:62px;height:62px;fill:#fff}
  .chip .katta{font-size:78px;font-weight:900;font-style:italic;
    text-transform:uppercase;line-height:1;white-space:nowrap}
  .chip .kichik{font-size:39px;font-weight:500;font-style:italic;
    color:rgba(255,255,255,.93);margin-top:10px}

  /* ---- hook sarlavha ---- */
  .hook{position:absolute;left:72px;top:36px;right:80px;font-size:66px;
    font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.12;
    text-shadow:0 6px 26px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.9);
    transform-origin:left top}
  .hook .soz{display:inline-block;margin-right:.28em}

  /* ---- o'tish qatlamlari ---- */
  .qora,.oq{position:absolute;inset:0;pointer-events:none}
  .qora{background:#000}
  .oq{background:#fff}
</style>
<body><div id="sahna"></div>
<script>
// ---------- easing ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOutCubic = p => 1-Math.pow(1-p,3);
const easeInCubic  = p => p*p*p;
const easeOutBack  = (p,s=1.9) => 1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2);
// referensdan o'lchangan spring: ~6% oshib ketadi, keyin tebranmay to'xtaydi
// Overshoot = amplituda * exp(-d*pi/w). Referensda ~6% o'lchangan,
// shuning uchun d/w ~ 0.31 bo'lishi kerak (d=3.9, w=12.5).
const spring = p => { if(p>=1) return 1;
  const d=3.9, w=12.5;
  return 1 - Math.exp(-d*p)*Math.cos(w*p); };

const SEN = window.__SENARIY__;
const T = parseFloat(new URLSearchParams(location.search).get('t')||'0');
const KIR = 0.34, CHIQ = 0.26;               // kirish va chiqish davomiyligi

const IKON = {
 odam:'<path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/>',
 kalendar:'<path d="M7 2v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14z"/>',
 yurak:'<path d="M12 21s-7.5-4.9-9.5-9A5.5 5.5 0 0112 5.6 5.5 5.5 0 0121.5 12c-2 4.1-9.5 9-9.5 9z"/>',
 plus:'<path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"/>'};
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function kirish(e){               // 0 -> ko'rinmaydi, 1 -> to'liq
  return clamp((T-e.start)/KIR);
}
function chiqish(e){              // 1 -> hali turibdi, 0 -> ketdi
  return 1-clamp((T-(e.end-CHIQ))/CHIQ);
}
const sahna=document.getElementById('sahna');

for(const e of SEN){
  if(T < e.start-0.12 || T > e.end+0.02) continue;
  const pk=kirish(e), pc=chiqish(e);
  const el=document.createElement('div'); el.className='qatlam';

  if(e.tur==='chip' || e.tur==='hook'){
    // kirish: spring bilan kattalashadi va ko'tariladi; chiqish: kichrayib so'nadi
    const s = pk<1 ? 0.72+0.28*spring(pk) : 1;
    const y = pk<1 ? 46*(1-easeOutCubic(pk)) : 0;
    const a = clamp(pk*1.6) * (pc<1 ? easeInCubic(pc) : 1);
    const sc = s * (pc<1 ? 0.94+0.06*pc : 1);

    if(e.tur==='chip'){
      // ichki elementlar stagger bilan: ikonka -> katta matn -> kichik matn
      const st=(i)=>clamp((T-e.start-0.06*i)/0.3);
      el.innerHTML=`<div class="chip" style="transform:translateY(${y}px) scale(${sc});opacity:${a}">
        <div class="ikon" style="transform:scale(${0.6+0.4*spring(st(0))})">
          <svg viewBox="0 0 24 24">${IKON[e.ikon||'odam']}</svg></div>
        <div style="flex:1;min-width:0">
          <div class="katta" style="opacity:${st(1)};transform:translateX(${18*(1-easeOutCubic(st(1)))}px)">${esc(e.katta)}</div>
          ${e.kichik?`<div class="kichik" style="opacity:${st(2)};transform:translateX(${18*(1-easeOutCubic(st(2)))}px)">${esc(e.kichik)}</div>`:''}
        </div></div>`;
    } else {
      // hook: so'zlar birin-ketin chiqadi
      const sozlar=e.matn.split(' ');
      const w=sozlar.map((s,i)=>{
        const p=clamp((T-e.start-0.11*i)/0.32);
        return `<span class="soz" style="opacity:${p};transform:translateY(${26*(1-easeOutBack(p||0.0001))}px) scale(${0.9+0.1*p})">${esc(s)}</span>`;
      }).join('');
      el.innerHTML=`<div class="hook" style="opacity:${pc<1?easeInCubic(pc):1}">${w}</div>`;
    }
  }

  if(e.tur==='karta'){
    // karta: oldin kadr qorayadi, keyin oq chaqnash, so'ng fon joyiga tushadi
    const dip = clamp((T-(e.start-0.08))/0.08) * (1-clamp((T-e.start)/0.02));
    const flash = T < e.start ? 0 : 1-clamp((T-e.start)/0.22);
    const fonS = 1.12-0.12*easeOutCubic(clamp((T-e.start)/0.9));
    const st=(i)=>clamp((T-e.start-0.10-0.12*i)/0.34);
    const bandW = 100*easeOutCubic(st(1));
    const chiplar=(e.chiplar||[]).map((c,i)=>{
      const p=st(2+i*0.4);
      return `<div class="k-chip" style="opacity:${p};transform:translateY(${20*(1-easeOutBack(p||0.0001))}px)">${esc(c)}</div>`;
    }).join('');
    const qp=st(3);
    el.innerHTML=`
      <div class="karta" style="transform:scale(${fonS});opacity:${clamp((T-e.start)/0.06)}">
        <div class="fon"></div><div class="setka"></div>
        <div class="tog"><svg viewBox="0 0 1080 300" preserveAspectRatio="none" height="300">
          <path d="M0,300 L0,210 L150,110 L260,215 L390,120 L520,230 L650,130 L790,225 L920,125 L1080,235 L1080,300 Z" fill="var(--tog1)"/>
          <path d="M0,300 L0,255 L120,195 L250,265 L380,205 L520,275 L660,210 L800,268 L940,200 L1080,262 L1080,300 Z" fill="var(--tog2)"/>
        </svg></div>
        ${e.ust?`<div class="k-ust" style="opacity:${st(0)};transform:translateY(${24*(1-easeOutCubic(st(0)))}px)">${esc(e.ust)}</div>`:''}
        ${e.band?`<div class="k-band" style="clip-path:inset(0 ${100-bandW}% 0 0)">
            <span style="transform:translateX(${-26*(1-easeOutCubic(st(1)))}px)">${esc(e.band)}</span></div>`:''}
        ${chiplar?`<div class="k-chiplar">${chiplar}</div>`:''}
        ${e.quote?`<div class="k-quote" style="opacity:${qp};transform:translateY(${30*(1-easeOutBack(qp||0.0001))}px) scale(${0.96+0.04*qp})">${esc(e.quote)}</div>`:''}
      </div>
      ${dip>0.001?`<div class="qora" style="opacity:${0.42*dip}"></div>`:''}
      ${flash>0.001?`<div class="oq" style="opacity:${0.88*easeInCubic(flash)}"></div>`:''}`;
  }
  sahna.appendChild(el);
}
</script>
